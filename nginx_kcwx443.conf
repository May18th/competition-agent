# 2026-09-30 419轮：kcwx.online 独立 443 站点
# 背景：原 nginx 只有 kechuang2026.cn 的 443 server 块，kcwx.online 落到 default_server，
# 于是下发了 kechuang2026.cn 的证书 → 域名不匹配 → 浏览器报证书警告。
# 源站已有 kcwx.online 的合法证书（DigiCert DV，有效期至 2026-12-23），直接接上即可。
server {
    listen 443 ssl;
    server_name kcwx.online www.kcwx.online;
    ssl_certificate /etc/nginx/kcwx.online.pem;
    ssl_certificate_key /etc/nginx/kcwx.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /favicon-32x32.png {
        alias /opt/comp-agent/static/favicon-32x32.png;
        access_log off;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        client_max_body_size 50m;
    }
}
