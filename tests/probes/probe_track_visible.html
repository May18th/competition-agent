<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>probe track</title>
<style>
  html,body{margin:0;background:#fff}
  iframe{display:block;width:100%;height:1500px;border:0}
</style>
</head>
<body>
<iframe id="f" src="/"></iframe>
<script>
// 探针壳：加载真实 index.html → 选 iCAN（唯一有三条赛道的赛事）→ 关掉新手引导/错误 toast
// → 按 ?open=1 决定是否展开「本赛事要求」卡。所有操作都在 iframe 同源文档内完成。
var OPEN = /open=1/.test(location.search);
var f = document.getElementById('f');
f.onload = function () {
  var w = f.contentWindow, d = f.contentDocument;
  var tries = 0;
  var t = setInterval(function () {
    tries++;
    var chip = d.querySelector('[data-comp^="iCAN"]');
    if (!chip) { if (tries > 80) clearInterval(t); return; }
    clearInterval(t);
    chip.click();
    setTimeout(function () {
      // 关新手引导 + 清掉 404 toast：探针没有后端，这两样都会挡住被测区域
      try { w.wbUaClose(); } catch (e) {}
      try { w.coachEnd(); } catch (e) {}
      ['wbUaMask', 'wbToast', 'wbGuideMask'].forEach(function (id) {
        var el = d.getElementById(id); if (el) el.remove();
      });
      if (OPEN) { try { w.evToggleBody(); } catch (e) {} }
      if (/gate=1/.test(location.search)) {
        // 模拟用户：填了创意、没选赛道、直接点生成 → 应被拦下并弹提示
        try {
          d.getElementById('idea').value = '校园快递最后一公里智能取件柜';
          d.getElementById('competition').value = 'iCAN大学生创新创业大赛';
          w.startWork();
        } catch (e) {}
      }
      if (/pick=1/.test(location.search)) {
        var c1 = d.querySelector('#evTrackChips .ev-track-chip');
        if (c1) c1.click();
      }
      setTimeout(function () {
        var badge = d.getElementById('evTrackBadge');
        var box = d.getElementById('evTrackBox');
        var cs = badge ? getComputedStyle(badge) : {};
        document.body.setAttribute('data-probe',
          'badge=' + (badge ? badge.textContent + '/' + cs.display : 'none') +
          '|box=' + (box ? getComputedStyle(box).display : 'none'));
      }, 700);
    }, 900);
  }, 100);
};
</script>
</body>
</html>
