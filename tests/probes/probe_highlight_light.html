    <h2>最容易踩的三块</h2>
    <p>智能取件柜在 iCAN 及同类赛事中出现频率较高，评委容易在三十秒内把它归入已知类别。<strong>同质化风险：中高</strong>，但风险不在选题本身。</p>
    <p><strong>方向一：把场景钉死在一个具体点位上。</strong>不要写「校园取件」，改写成「某类高校宿舍区晚间九点到十一点、外卖与快递混投场景下的取件冲突」。</p>
    <p><strong>方向二：补上闭环环节。</strong>常见项目停在「检测到超时即推送提醒」，缺少提醒后的复核。</p>
    <p><strong>方向三：拿出可量化的实证证据。</strong>哪怕只在一个点位做两周试点。</p>
